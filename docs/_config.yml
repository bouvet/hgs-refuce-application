title: HGS Refuce Application
description: Documentation for the HGS Refuce Application — waste/refuse tracking for a local Bouvet office.

url: "https://bouvet.github.io"
baseurl: "/hgs-refuce-application"

theme: null
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# just-the-docs settings
color_scheme: light
search_enabled: true
heading_anchors: true
nav_sort: case_insensitive

aux_links:
  "View on GitHub":
    - "https://github.com/bouvet/hgs-refuce-application"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "HGS Refuce Application documentation."

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
