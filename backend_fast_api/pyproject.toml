[project]
name = "hgs-refuce-application"
version = "0.1.0"
description = "Backend skeleton for hgs-refuce-application"
requires-python = ">=3.10"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
]

[tool.setuptools]
packages = ["hgs_refuce_app"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]