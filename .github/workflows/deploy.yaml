name: Deploy frontend + backend to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          # If the project supports static export, generate the out/ folder
          if [ -f package.json ] && grep -q "next export" package.json; then npm run export; fi

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          api_location: ""
          output_location: "frontend/out"

  build-and-deploy-backend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-frontend
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies and run tests
        run: |
          cd backend_fast_api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest

      - name: Package backend
        run: |
          cd ..
          zip -r deploy-backend.zip backend_fast_api

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: WasteFlow-backend
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_BACKEND }}
          package: deploy-backend.zip

# Notes:
# - Create an Azure Static Web App for the frontend and add its Deployment Token to GitHub secrets as AZURE_STATIC_WEB_APPS_API_TOKEN.
# - Create an Azure App Service (Linux, Python 3.11) for the backend named "WasteFlow-backend" and add its Publish Profile to GitHub secrets as AZURE_PUBLISH_PROFILE_BACKEND.
# - Configure the App Service startup command (e.g., gunicorn -k uvicorn.workers.UvicornWorker hgs_refuce_app.main:app) so the backend runs.
# - If frontend requires server-side Next runtime, Static Web Apps may need additional configuration; ask if Next uses SSR/edge functions.
